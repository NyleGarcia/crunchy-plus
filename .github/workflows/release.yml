# Release: release-please opens the release PR; on merge, attach the Chrome, Edge, Brave and Firefox zips (+ Firefox sources zip)
# with SLSA provenance attestations and a SHA256SUMS file (scripts/verify-release.sh checks both and rebuilds),
# then submit the Chrome zip to the Chrome Web Store as the publisher service account (API v2, Workload Identity
# Federation; skipped until the GCP_* variables / CHROME_* secrets exist — docs/release.md).
name: Release
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release PR branch, tag and GitHub release
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      prs_created: ${{ steps.rp.outputs.prs_created }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  # The release PR also rolls docs/changelog.md's "Unreleased" into the version section (release-please only writes
  # CHANGELOG.md from commits). release-please rewrites its branch on every main push; this re-applies the roll each time.
  changelog:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - name: Roll Unreleased into the version section
        env:
          TITLE: ${{ fromJSON(needs.release-please.outputs.pr).title }}
        run: |
          version=$(echo "$TITLE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [ -n "$version" ] || { echo "no version in PR title: $TITLE"; exit 0; }
          node scripts/roll-changelog.mjs "$version"
          if git diff --quiet; then echo "changelog already rolled"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs(changelog): $version"
          git push

  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # SLSA build provenance: signed statement that this zip came from this workflow at this commit
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: [chrome, edge, brave, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wxt zip -b ${{ matrix.target }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .output/*.zip
      - run: gh release upload "$TAG" .output/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

  checksums:
    needs: [release-please, assets]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: SHA256SUMS over every release zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir out && cd out
          gh release download "$TAG" -R "$REPO" -p '*.zip'
          sha256sum *.zip | tee SHA256SUMS
          gh release upload "$TAG" -R "$REPO" SHA256SUMS --clobber

  publish:
    needs: [release-please, assets]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write # Workload Identity Federation: GitHub's OIDC token → short-lived Google access token, no key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wxt zip -b chrome
      - name: Google access token for the publisher service account
        id: gcp
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - name: Submit to the Chrome Web Store (API v2)
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          if [ -z "$CHROME_SERVICE_ACCOUNT_ACCESS_TOKEN" ] || [ -z "$CHROME_PUBLISHER_ID" ] || [ -z "$CHROME_EXTENSION_ID" ]; then
            echo "::warning::Web Store publishing not configured (GCP_* variables / CHROME_* secrets) — zip attached to the release, nothing submitted (docs/release.md)"
            exit 0
          fi
          npx wxt submit --chrome-api-version v2 --chrome-zip .output/*-chrome.zip
